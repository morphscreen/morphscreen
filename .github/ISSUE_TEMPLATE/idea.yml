name: Idea
description: A component, an option or a change you'd like
labels: ["idea"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to build
      description: The app and the answer you want it to give, and what's in the way today.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What would help
      description: A component, an attribute, an SDK option. A sketch of the answer's text is welcome.
