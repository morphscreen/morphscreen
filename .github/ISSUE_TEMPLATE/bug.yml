name: Bug
description: Something draws wrong, breaks or doesn't match the docs
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The answer text
      description: If an answer drew wrong, paste the model's text (or the smallest part of it that shows the problem).
      render: markdown
  - type: input
    id: where
    attributes:
      label: Where
      description: "The SDK and version (@morphscreen/web 0.1.1, SwiftUI, Compose), and the browser or OS"
    validations:
      required: true
